
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | Todo App</title>
    <link rel="stylesheet" href="{% static 'css/edit_task.css' %}">
</head>
<body>

    <main class="page-container">
        <div class="edit-card">

            <div class="icon-wrapper">
                <span>✎</span>
            </div>

            <h1>Edit Task</h1>
            <p class="subtitle">Make changes to your task below.</p>

            <form method="post" action="">
                {% csrf_token %}

                <div class="form-group">
                    <label for="task_name">Task Name</label>
                    <input
                        type="text"
                        id="task_name"
                        name="task_name"
                        value="{{ mytask.task }}"
                        placeholder="Enter your task..."
                        required
                    >
                </div>

                <label class="checkbox-container" for="status">
                    <input
                        type="checkbox"
                        id="status"
                        name="status"
                        value="true"
                        {% if mytask.is_completed %}checked{% endif %}
                    >
                    <span class="custom-checkbox"></span>
                    <span class="checkbox-text">
                        <strong>Task completed</strong>
                        <small>Mark this task as finished</small>
                    </span>
                </label>

                <button type="submit" class="save-btn">
                    Save Changes
                    <span>→</span>
                </button>

                <a href="javascript:history.back()" class="cancel-link">
                    Cancel and go back
                </a>
            </form>

        </div>

        <p class="footer-text">Stay organized. Get things done.</p>
    </main>

</body>
</html>
